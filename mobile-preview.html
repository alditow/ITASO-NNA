<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ITASO NNA — Vista móvil</title>
  <style>
    *{box-sizing:border-box}
    :root{font-family:Inter,Arial,sans-serif;color:#101828;background:#eef0f3}
    body{min-height:100vh;margin:0;padding:24px;display:grid;grid-template-columns:minmax(240px,320px) auto;justify-content:center;align-items:start;gap:28px}
    .preview-controls{position:sticky;top:24px;padding:24px;border-radius:24px;background:#fff;box-shadow:0 12px 35px rgba(16,24,40,.1)}
    .preview-controls p{margin:0 0 8px;color:#DC2839;font-size:12px;font-weight:850;letter-spacing:.12em}
    .preview-controls h1{margin:0;font-size:32px;line-height:1}
    .preview-controls>span{display:block;margin-top:12px;color:#667085;font-size:14px;line-height:1.45}
    nav{margin-top:24px;display:grid;gap:8px}
    button{min-height:46px;padding:0 15px;border:1.5px solid #d0d5dd;border-radius:12px;background:#fff;color:#344054;font:750 14px/1 Inter,Arial,sans-serif;text-align:left;cursor:pointer}
    button:hover,button:focus-visible{border-color:#00A53D;background:#E4F9EA;outline:none}
    button[aria-current="page"]{border-color:#00A53D;background:#00A53D;color:#fff}
    .device{width:430px;padding:20px;border-radius:48px;background:#171b24;box-shadow:0 28px 60px rgba(16,24,40,.22)}
    .device::before{content:"";width:96px;height:6px;margin:0 auto 14px;display:block;border-radius:6px;background:#3d4350}
    iframe{width:390px;height:844px;display:block;border:0;border-radius:28px;background:#fff}
    @media(max-width:820px){body{padding:0;display:block;background:#fff}.preview-controls{position:static;border-radius:0;box-shadow:none}.preview-controls h1{font-size:26px}nav{grid-template-columns:repeat(2,1fr)}.device{width:100%;padding:0;border-radius:0;background:#fff;box-shadow:none}.device::before{display:none}iframe{width:100%;height:calc(100vh - 290px);min-height:620px;border-radius:0}}
  </style>
</head>
<body>
  <aside class="preview-controls">
    <p>VISTA DE TELÉFONO</p>
    <h1>ITASO NNA</h1>
    <span>El contenido se muestra dentro de un viewport fijo de 390 × 844 px.</span>
    <nav aria-label="Secciones para revisar">
      <button type="button" data-page="index.html" aria-current="page">Inicio</button>
      <button type="button" data-page="recursos.html">Recursos</button>
      <button type="button" data-page="juegos.html">Juegos</button>
      <button type="button" data-page="misiones.html">Misiones</button>
      <button type="button" data-page="logros.html">Logros</button>
      <button type="button" data-page="compartir.html">Compartir</button>
    </nav>
  </aside>
  <main class="device" aria-label="Previsualización móvil de ITASO">
    <iframe id="mobile-site" src="index.html" title="ITASO NNA en formato móvil"></iframe>
  </main>
  <script>
    const frame = document.querySelector('#mobile-site');
    const buttons = document.querySelectorAll('[data-page]');
    buttons.forEach((button) => button.addEventListener('click', () => {
      frame.src = button.dataset.page;
      buttons.forEach((item) => item.removeAttribute('aria-current'));
      button.setAttribute('aria-current', 'page');
    }));
  </script>
</body>
</html>
