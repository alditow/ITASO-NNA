<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<template id="page-inicio" data-body-class="">
<a class="skip-link" href="#contenido">Saltar al contenido</a>

  <header class="site-header" data-header>
    <a class="brand" href="#inicio" aria-label="ITASO NNA, volver al inicio">
      <img src="assets/ITASOR.svg" alt="ITASO">
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
      <span></span><span></span><span></span><span class="sr-only">Abrir menú</span>
    </button>
    <nav class="main-nav" id="main-nav" aria-label="Secciones de ITASO">
      <a class="nav-resources" href="index.html?page=recursos">Recursos</a>
      <a class="nav-games" href="index.html?page=juegos">Juegos</a>
      <a class="nav-missions" href="index.html?page=misiones">Misiones</a>
      <a class="nav-achievements" href="index.html?page=logros">Logros</a>
      <a class="nav-share" href="index.html?page=compartir">Compartir</a>
    </nav>
    <a class="caregiver-link" href="#" data-caregiver-link>Para cuidadores <span aria-hidden="true">→</span></a>
  </header>

  <main id="contenido">
    <section class="hero" id="inicio" aria-labelledby="hero-title">
      <div class="hero-copy reveal">
        <p class="eyebrow">ITASO NNA</p>
        <h1 id="hero-title"><span>Ideas claras</span><span>para tu día</span><span>a día.</span></h1>
        <p class="hero-lead">Explora cosas que forman parte de tu día y aprende a entenderlas mejor.</p>
        <div class="hero-actions">
          <a class="button button-primary" href="#por-que">Conócenos <span aria-hidden="true">→</span></a>
          <a class="button button-ghost" href="index.html?page=recursos">Ir directo a explorar</a>
        </div>
      </div>

      <div class="hero-visual reveal">
        <div class="speech-bubble" id="hero-character-message"><img class="hero-message-art" src="assets/texto-1.svg" alt="Aquí puedes crear un personaje a tu manera"></div>
        <div class="hero-orbit" aria-hidden="true">
          <span class="orbit-dot dot-one"></span>
          <span class="orbit-dot dot-two"></span>
          <span class="orbit-line"></span>
        </div>
        <button class="hero-character-trigger" type="button" data-open-customizer aria-describedby="hero-character-message" aria-label="Personalizar mi personaje">
          <span class="hero-avatar" data-hero-avatar>
            <img class="hero-avatar-body" src="assets/tomate-inicio.svg?v=20261003f" alt="Cabeza de tomate, personaje de ITASO listo para personalizar">
            <img class="hero-avatar-face" src="" alt="" hidden>
          </span>
          <span class="character-action">Personalizar <span aria-hidden="true">↗</span></span>
        </button>
      </div>
    </section>

    <div class="hero-divider" aria-hidden="true">
      <img src="assets/pleca.svg" alt="">
    </div>

    <section class="why section-shell" id="por-que" aria-labelledby="why-title">
      <div class="why-copy reveal">
        <p class="eyebrow eyebrow-orange">QUIÉNES SOMOS</p>
        <h2 id="why-title">Te ayudamos a entender mejor</h2>
        <div class="daily-formula" aria-label="Comemos más tomamos más nos movemos es igual a parte de todos nuestros días">
          <div class="formula-actions">
            <span>Comemos</span><b aria-hidden="true">+</b><span>Tomamos</span><b aria-hidden="true">+</b><span>Nos movemos</span>
          </div>
          <div class="formula-result"><b aria-hidden="true">=</b><strong>Parte de todos nuestros días</strong></div>
        </div>
        <p class="formula-note">Conocer más sobre lo que hacemos también nos ayuda a entenderlo mejor.</p>
      </div>
      <div class="why-visual reveal">
        <button class="why-character-trigger" type="button" aria-expanded="false" aria-controls="why-character-bubble">
          <img class="why-character" src="assets/berenjena-pensativa.svg" alt="Berenjena pensativa, personaje de ITASO">
          <span class="sr-only">Mostrar mensaje de la berenjena</span>
        </button>
        <div class="why-character-bubble" id="why-character-bubble" hidden><img src="assets/texto-3.svg" alt="Aprende a conocer mejor lo que comes, tomas y haces cada día"></div>
      </div>
    </section>

    <section class="how" id="como-funciona" aria-labelledby="how-title">
      <div class="section-heading reveal">
        <p class="eyebrow eyebrow-blue">ELIGE</p>
        <h2 id="how-title">Descubre cómo funciona</h2>
      </div>
      <div class="path-list">
        <article class="path-card reveal">
          <div class="path-card-fallback path-card-fallback-orange" aria-hidden="true"><strong>Recursos</strong><span>Lo que forma parte de tu día a día.</span></div>
          <img class="path-card-art" src="assets/recursostarjeta.svg?v=20261009-cardfix2" width="419" height="362" decoding="sync" fetchpriority="high" alt="Recursos: información para descubrir" onerror="this.hidden=true">
          <a class="path-card-cta cta-discover" href="index.html?page=recursos"><span>Explorar</span><b aria-hidden="true">→</b></a>
        </article>
        <article class="path-card reveal">
          <div class="path-card-fallback path-card-fallback-green" aria-hidden="true"><strong>Juega</strong><span>Lo que forma parte de tu día a día.</span></div>
          <img class="path-card-art" src="assets/juegatarjeta.svg?v=20261009-cardfix2" width="419" height="362" decoding="sync" fetchpriority="high" alt="Juegos: aprende mientras comparas y recuerdas" onerror="this.hidden=true">
          <a class="path-card-cta cta-play" href="index.html?page=juegos"><span>Jugar</span><b aria-hidden="true">→</b></a>
        </article>
        <article class="path-card reveal">
          <div class="path-card-fallback path-card-fallback-red" aria-hidden="true"><strong>Comparte</strong><span>Lo que forma parte de tu día a día.</span></div>
          <img class="path-card-art" src="assets/compartetarjeta.svg?v=20261009-cardfix2" width="419" height="362" decoding="sync" fetchpriority="high" alt="Compartir: cuéntalo y pregunta" onerror="this.hidden=true">
          <a class="path-card-cta cta-share" href="index.html?page=compartir"><span>Compartir</span><b aria-hidden="true">→</b></a>
        </article>
      </div>
    </section>

    <section class="principles section-shell" id="principios" aria-labelledby="principles-title">
      <div class="principles-intro reveal">
        <p class="eyebrow eyebrow-green">EN ITASO</p>
        <h2 id="principles-title">Así lo hacemos</h2>
        <img class="principles-character" src="assets/tomate-saltando.svg" alt="Tomate saltando, personaje de ITASO">
      </div>
      <div class="principles-graphic reveal">
        <article class="principle-card principle-red" tabindex="0">
          <span class="principle-number" aria-hidden="true">01</span>
          <div><h3>Cada quien es diferente</h3><p>Aquí no hay una sola forma de hacer las cosas.</p></div>
        </article>
        <article class="principle-card principle-blue" tabindex="0">
          <span class="principle-number" aria-hidden="true">02</span>
          <div><h3>Fácil de entender</h3><p>Te explicamos las cosas de forma clara y sencilla.</p></div>
        </article>
        <article class="principle-card principle-green" tabindex="0">
          <span class="principle-number" aria-hidden="true">03</span>
          <div><h3>Pasa todos los días</h3><p>Hablamos de cosas que ves y haces en tu día.</p></div>
        </article>
        <article class="principle-card principle-orange" tabindex="0">
          <span class="principle-number" aria-hidden="true">04</span>
          <div><h3>Aprendemos juntos</h3><p>Pregunta, descubre y comparte lo que aprendes.</p></div>
        </article>
      </div>
    </section>

    <section class="participate" id="participa" aria-labelledby="participate-title">
      <div class="participate-copy reveal">
        <p class="eyebrow">COMPARTE</p>
        <h2 id="participate-title">Lo que descubres también cuenta</h2>
        <p>Cada descubrimiento puede convertirse en una pregunta, una idea o una conversación.</p>
      </div>
      <div class="participate-visual reveal" aria-label="Personajes que comparten lo que aprenden">
        <img class="companions" src="assets/compas.svg" alt="Una zanahoria y una naranja conversando">
        <button class="companion-hotspot companion-left" type="button" data-companion-message="companion-message-one" aria-expanded="false"><span class="sr-only">Ver qué puede hacer el NNA</span></button>
        <button class="companion-hotspot companion-right" type="button" data-companion-message="companion-message-two" aria-expanded="false"><span class="sr-only">Ver cómo acompaña quien cuida</span></button>
        <img class="companion-message companion-message-one" id="companion-message-one" src="assets/texto-compa-1.svg" alt="Tú juegas, exploras y preguntas" hidden>
        <img class="companion-message companion-message-two" id="companion-message-two" src="assets/texto-compa-2.svg" alt="Quien te cuida te acompaña y decide contigo" hidden>
      </div>
    </section>

  </main>

  <section class="customizer" id="personalizador" hidden aria-labelledby="customizer-title" aria-modal="true" role="dialog">
    <header class="customizer-header">
      <img src="assets/ITASOR.svg" alt="ITASO">
      <p>Editor de personaje</p>
      <button class="customizer-close modal-close" type="button" data-close-customizer aria-label="Cerrar editor"><img src="assets/boton-x.svg" alt=""></button>
    </header>

    <div class="customizer-layout">
      <div class="avatar-stage" id="avatar-stage">
        <div class="avatar is-empty" id="avatar">
          <img class="avatar-body" src="" alt="">
          <img class="avatar-face" src="" alt="">
          <p class="avatar-prompt">Elige un personaje<br>para comenzar</p>
        </div>
        <p class="stage-caption">Así se ve tu personaje</p>
      </div>

      <div class="customizer-controls">
        <div class="customizer-intro">
          <p class="eyebrow eyebrow-orange">HAZLO A TU MANERA</p>
          <h2 id="customizer-title">Crea tu personaje</h2>
          <p>Elige una opción de cada grupo. Puedes cambiarla cuando quieras.</p>
        </div>

        <div class="identity-fields">
          <label>Tu nombre
            <input id="character-name" type="text" maxlength="18" placeholder="Escribe tu nombre" autocomplete="off">
          </label>
        </div>

        <fieldset class="choice-group">
          <legend><span>01</span> Elige tu personaje</legend>
          <div class="fruit-options option-grid option-grid-fruit">
            <button class="option fruit-option" type="button" data-fruit="tomate" aria-label="Tomate"><img src="assets/tomate-1.svg" alt=""></button>
            <button class="option fruit-option" type="button" data-fruit="zanahoria" aria-label="Zanahoria"><img src="assets/zanahoria-1.svg" alt=""></button>
            <button class="option fruit-option" type="button" data-fruit="naranja" aria-label="Naranja"><img src="assets/naranja-1.svg" alt=""></button>
            <button class="option fruit-option" type="button" data-fruit="berenjena" aria-label="Berenjena"><img src="assets/berenjena-1.svg" alt=""></button>
            <button class="option fruit-option reward-fruit" type="button" data-fruit="fresa" data-unlock-threshold="140" aria-label="Fresa, se desbloquea con 140 puntos" disabled><img src="assets/fresa-1.svg" alt=""></button>
          </div>
        </fieldset>

        <fieldset class="choice-group">
          <legend><span>02</span> Elige una forma</legend>
          <div class="shape-options option-grid option-grid-shape">
            <button class="option shape-option" type="button" data-shape="0" disabled aria-label="Forma 1"><img src="" alt=""></button>
            <button class="option shape-option" type="button" data-shape="1" disabled aria-label="Forma 2"><img src="" alt=""></button>
            <button class="option shape-option" type="button" data-shape="2" disabled aria-label="Forma 3"><img src="" alt=""></button>
          </div>
        </fieldset>

        <fieldset class="choice-group">
          <legend><span>03</span> Elige una expresión</legend>
          <div class="expression-options option-grid option-grid-expression" id="expression-options"></div>
        </fieldset>

        <fieldset class="choice-group">
          <legend><span>04</span> Elige el fondo</legend>
          <div class="color-options">
            <button type="button" class="color-option" data-color="#ffd21f" style="--swatch:#ffd21f" aria-label="Amarillo"></button>
            <button type="button" class="color-option" data-color="#3db5e6" style="--swatch:#3db5e6" aria-label="Azul"></button>
            <button type="button" class="color-option" data-color="#2eaf47" style="--swatch:#2eaf47" aria-label="Verde"></button>
            <button type="button" class="color-option" data-color="#f56a28" style="--swatch:#f56a28" aria-label="Naranja"></button>
            <button type="button" class="color-option" data-color="#dc2839" style="--swatch:#dc2839" aria-label="Rojo"></button>
          </div>
        </fieldset>

        <div class="customizer-actions">
          <button class="button button-dark finish-character" type="button">Así me gusta <span aria-hidden="true">→</span></button>
          <button class="cancel-character" type="button" data-close-customizer>Seguir sin cambios</button>
        </div>
      </div>
    </div>
  </section>

  <footer class="site-footer site-footer-home">
    <a class="footer-brand" href="#inicio" aria-label="Volver al inicio de ITASO NNA">
      <img src="assets/ITASOR.svg" alt="ITASO">
    </a>
    <nav class="footer-links" aria-label="Información del sitio">
      <button type="button">Privacidad</button>
      <button type="button">Términos</button>
      <a href="mailto:contacto@itaso.mx">Contacto</a>
    </nav>
  </footer>

  <div class="notice" role="status" aria-live="polite" hidden>
    El acceso al sitio de cuidadores se conectará aquí.
  </div>
</template>

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">

  <main id="contenido">

      <div class="resources-intro-copy resource-reveal">
        <p class="eyebrow eyebrow-orange">PARA EXPLORAR</p>
        <h1 id="resources-title">Recursos</h1>
        <p>Descubre cosas que puedes encontrar en tu día.</p>
      </div>
    </section>

    <section class="resource-explorer" aria-labelledby="explore-title">
      <div class="resource-heading resource-reveal">
        <p class="eyebrow eyebrow-orange">ELIGE</p>
        <h2 id="explore-title">Algo para entender mejor</h2>
      </div>

      <div class="resource-layout">
        <article class="resource-card content-card card-orange resource-feature resource-reveal">

            <h3>Sellos de advertencia</h3>
            <p>Descubre qué significan.</p>
            <button class="resource-button content-card-cta" type="button" data-resource="sellos">Explorar <span aria-hidden="true">→</span></button>
          </div>
          </div>
        </article>

        <article class="resource-card content-card card-green resource-sugar resource-reveal">
          <div class="content-card-art" aria-hidden="true"><img class="card-art-asset art-sugar" src="assets/resource-icons/azucaricon.svg" alt=""></div>
          <div class="content-card-body">
            <span class="content-card-icon" aria-hidden="true"><img class="category-icon" src="assets/resource-icons/hidratacion.svg" alt=""></span>
          <div class="resource-copy content-card-copy">
            <h3>Azúcar en bebidas</h3>
            <p>Compara y mira las diferencias.</p>
            <button class="resource-button content-card-cta" type="button" data-resource="bebidas">Comparar <span aria-hidden="true">→</span></button>
          </div>
          </div>
        </article>

        <article class="resource-card content-card card-blue resource-groups resource-reveal">
          <div class="content-card-art" aria-hidden="true"><img class="card-art-asset art-food" src="assets/resource-icons/pescado.png" alt=""></div>
          <div class="content-card-body">
            <span class="content-card-icon" aria-hidden="true"><img class="category-icon" src="assets/resource-icons/nutricion.svg" alt=""></span>
          <div class="resource-copy content-card-copy">
            <h3>Grupos de alimentos</h3>
            <p>Conoce dónde pertenece cada uno.</p>
            <button class="resource-button content-card-cta" type="button" data-resource="grupos">Descubrir <span aria-hidden="true">→</span></button>
          </div>
          </div>
        </article>

        <article class="resource-card content-card card-yellow resource-package resource-reveal">
          <div class="content-card-art" aria-hidden="true"><img class="card-art-asset art-package" src="assets/resource-icons/empaqueicon.svg" alt=""></div>
          <div class="content-card-body">
            <span class="content-card-icon" aria-hidden="true"><img class="category-icon" src="assets/resource-icons/educacion-amarillo.svg" alt=""></span>
          <div class="resource-copy content-card-copy">
            <h3>Empaques</h3>
            <p>Encuentra las pistas del frente y etiqueta.</p>
            <button class="resource-button content-card-cta" type="button" data-resource="empaque">Analiza <span aria-hidden="true">→</span></button>
          </div>
          </div>
        </article>

        <article class="resource-card content-card card-red resource-movement resource-reveal">
          <div class="content-card-art" aria-hidden="true"><img class="card-art-asset art-movement" src="assets/resource-icons/tomatecorriendo.svg" alt=""></div>
          <div class="content-card-body">
            <span class="content-card-icon" aria-hidden="true"><img class="category-icon" src="assets/resource-icons/actfisica.svg" alt=""></span>
          <div class="resource-copy content-card-copy">
            <h3>Moverte también cuenta</h3>
            <p>Descubre otras formas de cuidar tu día.</p>
            <button class="resource-button content-card-cta" type="button" data-resource="movimiento">Ver más <span aria-hidden="true">→</span></button>
          </div>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer site-footer-secondary">
    <a class="footer-brand" href="index.html" aria-label="Volver al inicio de ITASO NNA">
      <img src="assets/ITASOR.svg" alt="ITASO">
    </a>
    <nav class="footer-links" aria-label="Información del sitio">
      <button type="button">Privacidad</button>
      <button type="button">Términos</button>
      <a href="mailto:contacto@itaso.mx">Contacto</a>
    </nav>
  </footer>

  <section class="resource-modal" id="resource-modal" role="dialog" aria-modal="true" aria-labelledby="resource-modal-title" aria-describedby="resource-modal-description" hidden>
    <div class="resource-dialog" data-modal-accent="orange">
      <button class="resource-close modal-close" type="button" data-close-resource aria-label="Cerrar recurso"><img src="assets/boton-x.svg" alt=""></button>
      <span class="resource-scroll-cue" aria-hidden="true"><span>↓</span></span>

      <div class="resource-modal-layout">
        <article class="resource-modal-content">
          <p class="resource-modal-kicker" id="resource-modal-kicker">RECURSO</p>
          <h2 id="resource-modal-title"></h2>
          <p class="resource-modal-description" id="resource-modal-description"></p>

          <div class="resource-learning-grid">
            <aside class="resource-modal-highlight" aria-labelledby="resource-modal-fact-label">
              <p class="resource-fact-label" id="resource-modal-fact-label">¿SABÍAS QUE?</p>
              <div class="resource-key-visual" id="resource-key-visual"></div>
              <p class="resource-fact-copy" id="resource-modal-fact"></p>
            </aside>

            <section class="resource-important" aria-labelledby="resource-important-title">
              <h3 id="resource-important-title">LO IMPORTANTE</h3>
              <div class="resource-information" id="resource-modal-information"></div>
            </section>
          </div>

          <aside class="resource-remember">
            <span>PARA RECORDAR</span>
            <p id="resource-modal-remember"></p>
          </aside>

          <p class="resource-source">Fuente: <a id="resource-modal-source" href="#" target="_blank" rel="noreferrer"></a></p>
        </article>
      </div>
    </div>
  </section>

  <p class="notice" role="status" aria-live="polite" hidden></p>
</template>

<template id="page-juegos" data-body-class="games-page">
<a class="skip-link" href="#contenido">Saltar al contenido</a>

  <header class="site-header" data-header>
    <a class="brand" href="index.html" aria-label="ITASO NNA, volver al inicio">
      <img src="assets/ITASOR.svg" alt="ITASO">
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
      <span></span><span></span><span></span><span class="sr-only">Abrir menú</span>
    </button>
    <nav class="main-nav" id="main-nav" aria-label="Secciones de ITASO">
      <a class="nav-resources" href="index.html?page=recursos">Recursos</a>
      <a class="nav-games is-active" href="index.html?page=juegos" aria-current="page">Juegos</a>
      <a class="nav-missions" href="index.html?page=misiones">Misiones</a>
      <a class="nav-achievements" href="index.html?page=logros">Logros</a>
      <a class="nav-share" href="index.html?page=compartir">Compartir</a>
    </nav>
    <a class="caregiver-link" href="#" data-caregiver-link>Para cuidadores <span aria-hidden="true">→</span></a>
  </header>

  <main id="contenido">
    <section class="games-intro" aria-labelledby="games-title">
      <div class="games-intro-copy game-reveal">
        <p class="eyebrow eyebrow-green">PARA PROBAR</p>
        <h1 id="games-title">Juegos</h1>
        <p>Juega, prueba y descubre nuevas pistas.</p>
      </div>
    </section>

<script>
(() => {
  const pages = {"inicio": {"styles": [], "scripts": ["script.js"], "title": "ITASO NNA — Inicio"}, "recursos": {"styles": ["recursos.css?v=20261009b", "section-tuning.css"], "scripts": ["recursos.js"], "title": "Recursos — ITASO NNA"}, "juegos": {"styles": ["juegos.css"], "scripts": ["juegos.js"], "title": "Juegos — ITASO NNA"}, "misiones": {"styles": ["misiones.css", "section-tuning.css"], "scripts": ["misiones.js"], "title": "Misiones — ITASO NNA"}, "logros": {"styles": ["logros.css", "section-tuning.css"], "scripts": ["logros.js"], "title": "Logros — ITASO NNA"}, "compartir": {"styles": ["compartir.css", "section-tuning.css"], "scripts": ["compartir.js"], "title": "Compartir — ITASO NNA"}, "cual-tiene-mas": {"styles": ["cual-tiene-mas.css?v=20261009c"], "scripts": ["data/drinkData.js", "cual-tiene-mas.js"], "title": "¿Cuál tiene más? — ITASO NNA"}, "memorama": {"styles": ["memorama.css"], "scripts": ["data/memoramaDrinks.js", "memorama.js"], "title": "Memorama — ITASO NNA"}};
  const params = new URLSearchParams(location.search);
  let route = params.get('page') || 'inicio';
  if (!pages[route]) route = 'inicio';
  const template = document.querySelector(`#page-${route}`);
  const bodyClass = template.dataset.bodyClass || '';
  const content = template.content.cloneNode(true);
  document.body.replaceChildren(content);
  document.body.className = bodyClass;
  document.title = pages[route].title;
  pages[route].styles.forEach((href) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = href;
    document.head.appendChild(link);
  });
  const reveal = () => document.querySelector('#route-loading-style')?.remove();
  const scripts = ['reset-on-reload.js', ...pages[route].scripts];
  const load = (index) => {
    if (index >= scripts.length) { reveal(); return; }
    const script = document.createElement('script');
    script.src = scripts[index];
    script.onload = () => load(index + 1);
    script.onerror = () => { console.error(`No se pudo cargar ${scripts[index]}`); reveal(); };
    document.body.appendChild(script);
  };
  load(0);
  setTimeout(reveal, 1800);
})();
</script>
